<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me | Shahd Fakhouri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#081b29",
              tealish: "#17a2b8",
              softDark: "#464564",
              limeHover: "greenyellow",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-gradient-to-br from-primary via-softDark to-primary text-white font-sans"
  >
    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Contact Section -->
    <section class="pt-32 pb-20 px-6 md:px-20 text-center">
      <h3 class="text-lg text-tealish tracking-wider mb-2" data-aos="fade-down">
        Let’s Connect
      </h3>
      <h1
        class="text-4xl font-bold text-limeHover mb-6"
        data-aos="fade-down"
        data-aos-delay="100"
      >
        Contact Me
      </h1>
      <p
        class="text-gray-300 mb-10 text-lg"
        data-aos="fade-down"
        data-aos-delay="200"
      >
        A simple <span class="text-tealish">"Hello"</span> could lead to a
        million things!
      </p>

      <div
        class="bg-softDark p-8 rounded-2xl shadow-xl max-w-xl mx-auto transform hover:scale-105 transition duration-500 hover:shadow-2xl"
        data-aos="fade-up"
      >
        <img
          src="./images/before.png"
          alt="Shahd Profile"
          class="mb-4 mx-auto w-32 h-32 rounded-full object-cover shadow-lg transition duration-500 hover:scale-105"
          onmouseover="changePhoto(this)"
          onmouseout="resetPhoto(this)"
        />

        <p class="text-lg mb-4">📍 Ramallah, Palestine</p>
        <a
          href="mailto:shahd.zeiad@gmail.com"
          class="block mb-2 text-tealish hover:underline"
          >📧 shahd.zeiad@gmail.com</a
        >
        <a
          href="tel:00970595444141"
          class="block mb-6 text-tealish hover:underline"
          >📱 +970 595 444 141</a
        >

        <div class="flex justify-center gap-6 mt-4">
          <a
            href="https://www.linkedin.com/in/shahd-fakhouri-474b14119/"
            target="_blank"
            class="text-white hover:text-tealish transition text-3xl"
            ><i class="fab fa-linkedin-in"></i
          ></a>
          <a
            href="https://www.behance.net/shahdzeiad"
            target="_blank"
            class="text-white hover:text-tealish transition text-3xl"
            ><i class="fab fa-behance"></i
          ></a>
          <a
            href="https://github.com/shahdzeiad96"
            target="_blank"
            class="text-white hover:text-tealish transition text-3xl"
            ><i class="fab fa-github"></i
          ></a>
        </div>
      </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      function changePhoto(el) {
        el.src = "./images/after.png";
      }
      function resetPhoto(el) {
        el.src = "./images/before.png";
      }
      AOS.init({ duration: 800, once: true });

      fetch("./navbar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });

      fetch("./footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>
